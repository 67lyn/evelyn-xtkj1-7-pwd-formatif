
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button set</title>

    <style>

body {
    background-color: #E6E5D5;
    background-image: radial-gradient(#BFB9A3 2px, transparent 2px);
    background-size: 24px 24px;
    font-family: Arial, sans-serif;
}

h2 {
    color: #66281F;
    font-size: 20px;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
    border: 2px solid white;
}

.button-group .btn {
    margin-right: 10px;
    margin-bottom: 10px;
}

.btn-primary {
    background-color: #66281F;
    color: white;
}

.btn-secondary {
    background-color: #9D8361;
    color: white;
}

.btn-outline {
    background-color: #ADADAD;
    color: white;
}

.btn-send {
    background-color: #BFB9A3;
    color: white;
}

.btn-primary:hover {
    background-color: #994D47;
}

.btn-secondary:hover {
    background-color: #BC9F78;
}

.btn-outline:hover {
    background-color: #BCBBBB;
    color: white;
}

.btn-send:hover {
    background-color: #E6E5D5;
    color: #66281F;
}

footer a {
    color: #994D47;
    font-size: 13px;
    text-decoration: none;
}

footer a:hover {
    color: #66281F;
    text-decoration: underline;
}

    </style>
</head>

<body>

<main>
    <h2>Kumpulan tombol</h2>

    <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
        <a href="#" class="btn btn-send">Kirim Pesan</a>
    </div>
</main>

<footer>
    <a href="#">Kembali ke beranda</a>
</footer>

</body>
</html>
