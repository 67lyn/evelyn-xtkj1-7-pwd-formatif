<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button set</title>
    <style>

body {
    background-color: #f4f4f4;
    font-family: Arial, sans-serif;
}

h2 {
    color: #222222;
    font-size: 20px;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.button-group .btn {
    margin-right: 10px;
    margin-bottom: 10px;
}

.btn-primary {
    background-color: #66281F;
    color: white;
}

.btn-secondary {
    background-color: #9D8361;
    color: white;
}

.btn-outline {
    background-color:    rgb(173, 173, 173);
    color: black;
}

.btn-send {
    background-color: #c2bfa6;
    color: white;
}

.btn{
    border: 2px solid white;
}


.btn-secondary,
.btn-outline {
    color: white;
}

.btn-primary:hover {
    background-color:#994D47;
}

.btn-secondary:hover {
    background-color: #bc9f78;
}

.btn-outline:hover {
    background-color:   rgb(188, 187, 187);
    color: white;
}

.btn-send:hover {
    background-color: #E6E5D5;
}

footer a {
    color: purple;
    font-size: 13px;
}

    </style>
</head>
<body>
<main> 
    <H2>Kumpulan tombol</H2>
    
    <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
        <a href="#" class="btn btn-send">Kirim Pesan</a>
    </div>
</main>

<footer>
    <a href="#">Kembali ke beranda</a>
</footer>


</body>
</html>
